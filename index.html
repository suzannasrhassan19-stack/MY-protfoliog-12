<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تطبيق ويب لإدارة نتائج الطلاب وتطبيق لجنة الرأفة">
  <title>نظام إدارة النتائج</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="text-center mb-4">
      <h1 class="fw-bold">نظام إدارة النتائج</h1>
      <p class="text-secondary mb-0">إضافة الطلاب وتحليل النتائج وتفعيل لجنة الرأفة</p>
    </header>

    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h2 class="section-title h5 mb-3">بيانات الطالب</h2>

        <form id="studentForm" novalidate>
          <div class="row g-3">
            <div class="col-12">
              <label for="studentName" class="form-label">اسم الطالب</label>
              <input type="text" class="form-control" id="studentName"
                     placeholder="اكتب اسم الطالب" autocomplete="off">
            </div>

            <div class="col-12 col-md-4">
              <label for="grade1" class="form-label">درجة المادة الأولى</label>
              <input type="number" class="form-control" id="grade1"
                     min="0" max="100" step="any" placeholder="من 0 إلى 100">
            </div>
            <div class="col-12 col-md-4">
              <label for="grade2" class="form-label">درجة المادة الثانية</label>
              <input type="number" class="form-control" id="grade2"
                     min="0" max="100" step="any" placeholder="من 0 إلى 100">
            </div>
            <div class="col-12 col-md-4">
              <label for="grade3" class="form-label">درجة المادة الثالثة</label>
              <input type="number" class="form-control" id="grade3"
                     min="0" max="100" step="any" placeholder="من 0 إلى 100">
            </div>

            <div class="col-12">
              <label for="attendance" class="form-label">نسبة الحضور</label>
              <input type="number" class="form-control" id="attendance"
                     min="0" max="100" step="any" placeholder="من 0 إلى 100">
            </div>
          </div>

          <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4">إضافة طالب</button>
            <button type="button" id="graceButton" class="btn btn-success px-4">
              تفعيل لجنة الرأفة
            </button>
          </div>
        </form>

        <div id="errorBox" class="alert alert-danger mt-3 mb-0 d-none"
             role="alert" aria-live="polite"></div>
        <div id="successBox" class="alert alert-success mt-3 mb-0 d-none"
             role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="section-title h5 mb-0">قائمة الطلاب</h2>
          <span id="studentsCount" class="badge text-bg-primary">0 طالب</span>
        </div>
        <div id="studentsList">
          <p class="text-secondary mb-0">لم تتم إضافة أي طالب حتى الآن.</p>
        </div>
      </div>
    </section>

    <section class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="section-title h5 mb-3">التقرير النهائي للجنة الرأفة</h2>
        <div id="reportBox" aria-live="polite">
          <p class="text-secondary mb-0">اضغط على زر «تفعيل لجنة الرأفة» لعرض التقرير.</p>
        </div>
      </div>
    </section>

    <footer class="text-center text-secondary small mt-4">
      مشروع JavaScript - نظام إدارة النتائج
    </footer>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
